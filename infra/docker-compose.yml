version: "3.9"

services:
  backend-api:
    build:
      context: ../packages/backend-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ../packages/shared:/app/shared:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  telegram-bot:
    build:
      context: ../packages/telegram-bot
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      - BACKEND_URL=http://backend-api:8000
    depends_on:
      backend-api:
        condition: service_healthy
    volumes:
      - ../packages/shared:/app/shared:ro
    restart: unless-stopped

